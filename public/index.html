<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pingüi - Tutor IA de Idiomas</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col h-[90vh]">
    
    <!-- Encabezado / Header -->
    <div class="bg-sky-500 text-white p-4 flex flex-col gap-2 shadow-md relative">
      <div class="flex justify-between items-center text-xs font-bold">
        <span class="bg-amber-400 text-slate-800 px-2 py-1 rounded-full flex items-center gap-1">
          🔥 Racha: <span id="rachaVal">1</span> d
        </span>
        <button id="btnVocabulario" class="bg-sky-700 hover:bg-sky-800 text-white px-3 py-1 rounded-full text-xs transition">
          📖 Vocabulario
        </button>
        <span class="bg-sky-700 text-white px-2 py-1 rounded-full flex items-center gap-1">
          ⭐ XP: <span id="xpVal">40</span>
        </span>
      </div>

      <!-- Selección de Tutor y Velocidad -->
      <div class="flex justify-between items-center mt-1">
        <div class="flex bg-sky-600 p-1 rounded-xl gap-1">
          <button id="btnPenny" onclick="seleccionarTutor('female')" class="px-3 py-1 rounded-lg text-xs font-bold bg-white text-sky-700 shadow">
            👩‍🏫 Tutora (Penny)
          </button>
          <button id="btnPingu" onclick="seleccionarTutor('male')" class="px-3 py-1 rounded-lg text-xs font-bold text-white hover:bg-sky-500">
            🧑‍🏫 Tutor (Pingu)
          </button>
        </div>

        <button id="btnVelocidad" onclick="cambiarVelocidad()" class="bg-sky-600 hover:bg-sky-700 p-2 rounded-full text-sm" title="Cambiar velocidad de voz">
          🐇
        </button>
      </div>

      <!-- Perfil del Tutor -->
      <div class="flex flex-col items-center mt-2">
        <div class="w-20 h-20 rounded-full border-4 border-white shadow-md overflow-hidden bg-white">
          <img id="avatarTutor" src="/pinguina.jpg" alt="Tutor" class="w-full h-full object-cover">
        </div>
        <h1 id="nombreTutor" class="text-xl font-bold mt-1">Penny 🐧</h1>
        
        <!-- Selectores de Idioma y Nivel -->
        <div class="flex gap-2 mt-2 w-full px-4">
          <select id="selectIdioma" class="bg-white text-slate-700 text-xs font-bold py-1 px-2 rounded-lg border w-1/2">
            <option value="Inglés GB">Inglés GB</option>
            <option value="Inglés US">Inglés US</option>
            <option value="Francés">Francés</option>
            <option value="Alemán">Alemán</option>
            <option value="Italiano">Italiano</option>
          </select>
          <select id="selectNivel" class="bg-white text-slate-700 text-xs font-bold py-1 px-2 rounded-lg border w-1/2">
            <option value="Curso General">📚 Curso General</option>
            <option value="Principiante">🌱 Principiante (A1)</option>
            <option value="Intermedio">🌿 Intermedio (B1)</option>
            <option value="Avanzado">🌳 Avanzado (C1)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Área de Chat -->
    <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
      <div class="flex gap-2 items-start">
        <div class="bg-sky-100 text-sky-900 p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm shadow-sm">
          ¡Hola! Soy <span id="saludoNombre">Penny</span> 🐧, tu profesora inteligente. ¡Háblame y aprendamos juntos!
        </div>
      </div>
    </div>

    <!-- Entrada de Texto -->
    <div class="p-3 bg-white border-t flex items-center gap-2">
      <button id="btnVoz" onclick="activarMicrofono()" class="bg-red-500 hover:bg-red-600 text-white p-3 rounded-full shadow transition flex-shrink-0">
        🎙️
      </button>
      <input type="text" id="userInput" placeholder="Escribe o habla..." class="flex-1 border border-slate-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-sky-500" onkeypress="handleKeyPress(event)">
      <button onclick="enviarMensaje()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-full font-bold text-sm shadow transition flex-shrink-0">
        Enviar
      </button>
    </div>

  </div>

  <script>
    let tutorActual = 'female';
    let velocidadVoz = 1.0;
    let xp = 40;

    // Activar reproductor de voz al tocar pantalla en móvil
    document.body.addEventListener('click', () => {
      if ('speechSynthesis' in window && window.speechSynthesis.speaking === false) {
        window.speechSynthesis.resume();
      }
    }, { once: true });

    function seleccionarTutor(genero) {
      tutorActual = genero;
      const avatar = document.getElementById('avatarTutor');
      const nombre = document.getElementById('nombreTutor');
      const saludoNombre = document.getElementById('saludoNombre');
      const btnPenny = document.getElementById('btnPenny');
      const btnPingu = document.getElementById('btnPingu');

      if (genero === 'female') {
        avatar.src = '/pinguina.jpg';
        nombre.textContent = 'Penny 🐧';
        saludoNombre.textContent = 'Penny';
        btnPenny.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-white text-sky-700 shadow';
        btnPingu.className = 'px-3 py-1 rounded-lg text-xs font-bold text-white hover:bg-sky-500';
      } else {
        avatar.src = '/pinguino.jpg';
        nombre.textContent = 'Pingu 🐧';
        saludoNombre.textContent = 'Pingu';
        btnPingu.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-white text-sky-700 shadow';
        btnPenny.className = 'px-3 py-1 rounded-lg text-xs font-bold text-white hover:bg-sky-500';
      }
    }

    function cambiarVelocidad() {
      const btn = document.getElementById('btnVelocidad');
      if (velocidadVoz === 1.0) {
        velocidadVoz = 0.7;
        btn.textContent = '🐢';
        btn.title = 'Voz Lenta';
      } else {
        velocidadVoz = 1.0;
        btn.textContent = '🐇';
        btn.title = 'Voz Normal';
      }
    }

    // LIMPIAR ASTERRISCOS Y SÍMBOLOS ANTES DE HABLAR
    function limpiarTextoParaVoz(texto) {
      return texto
        .replace(/[\*\#\_]/g, '') // Elimina *, #, _
        .replace(/[\(\)\[\]]/g, '') // Elimina paréntesis y corchetes
        .trim();
    }

    function hablar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const textoLimpio = limpiarTextoParaVoz(texto);
        const utterance = new SpeechSynthesisUtterance(textoLimpio);
        const idioma = document.getElementById('selectIdioma').value;
        
        if (idioma.includes('GB')) utterance.lang = 'en-GB';
        else if (idioma.includes('US')) utterance.lang = 'en-US';
        else if (idioma.includes('Francés')) utterance.lang = 'fr-FR';
        else if (idioma.includes('Alemán')) utterance.lang = 'de-DE';
        else if (idioma.includes('Italiano')) utterance.lang = 'it-IT';
        else utterance.lang = 'en-US';

        utterance.rate = velocidadVoz;
        window.speechSynthesis.speak(utterance);
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') enviarMensaje();
    }

    async function enviarMensaje() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      const userDiv = document.createElement('div');
      userDiv.className = 'flex justify-end';
      userDiv.innerHTML = `<div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[80%] text-sm shadow-sm">${text}</div>`;
      chatBox.appendChild(userDiv);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const tutorDiv = document.createElement('div');
      tutorDiv.className = 'flex gap-2 items-start';
      const msgBubble = document.createElement('div');
      msgBubble.className = 'bg-sky-100 text-sky-900 p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm shadow-sm';
      msgBubble.textContent = 'Pensando...';
      tutorDiv.appendChild(msgBubble);
      chatBox.appendChild(tutorDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('/api/chat-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            targetLanguage: document.getElementById('selectIdioma').value,
            gender: tutorActual
          })
        });

        if (!response.ok) throw new Error('Error en la respuesta');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        msgBubble.textContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          fullText += chunk;
          msgBubble.textContent = fullText;
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Hablar sin leer asteriscos ni símbolos
        hablar(fullText);

        xp += 10;
        document.getElementById('xpVal').textContent = xp;

      } catch (err) {
        msgBubble.textContent = 'Error interno del servidor al procesar la respuesta.';
      }
    }

    function activarMicrofono() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Tu navegador no soporta el reconocimiento de voz.');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.onstart = () => {
        document.getElementById('btnVoz').className = 'bg-green-500 text-white p-3 rounded-full shadow animate-pulse flex-shrink-0';
      };
      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        enviarMensaje();
      };
      recognition.onend = () => {
        document.getElementById('btnVoz').className = 'bg-red-500 hover:bg-red-600 text-white p-3 rounded-full shadow transition flex-shrink-0';
      };
      recognition.start();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
