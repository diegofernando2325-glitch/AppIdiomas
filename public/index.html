<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pingüi - Tutor IA de Idiomas</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #3b97ea;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* --- VISTA 1: CONFIGURACIÓN / INICIO --- */
    #view-setup {
      background: #f0f4f8;
      width: 100%;
      max-width: 420px;
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .top-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .stat-badge {
      background: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      color: #d9534f;
    }

    .stat-badge.xp {
      color: #337ab7;
    }

    .avatar-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #4a90e2;
      margin: 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      overflow: hidden;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      font-size: 11px;
      font-weight: bold;
      color: #777;
      text-transform: uppercase;
      display: block;
      margin-bottom: 5px;
    }

    .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    .btn-start {
      width: 100%;
      background: #509eed;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: background 0.2s;
    }

    .btn-start:hover {
      background: #3b82d6;
    }

    /* --- VISTA 2: CHAT INTERACTIVO --- */
    #view-chat {
      display: none; /* Oculto por defecto */
      background: #fff;
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 700px;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      flex-direction: column;
    }

    .chat-header {
      background: #179be6;
      color: white;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    .btn-back {
      position: absolute;
      left: 15px;
      top: 15px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .chat-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #fff;
      margin: 10px auto 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .chat-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.bot {
      background: #e1f0ff;
      color: #1a4a75;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background: #509eed;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-footer {
      padding: 10px 15px;
      background: #fff;
      display: flex;
      gap: 10px;
      border-top: 1px solid #eee;
    }

    .chat-footer input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
    }

    .chat-footer button {
      background: #2b7bc0;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- VENTANA 1: CONFIGURACIÓN -->
  <div id="view-setup">
    <div class="top-stats">
      <span class="stat-badge">🔥 Racha: 1 d</span>
      <span class="stat-badge xp">⭐ XP: 40</span>
    </div>

    <h2 style="color: #2c3e50;">Pingüi 🐧</h2>
    <p style="font-size: 12px; color: #7f8c8d; margin-bottom: 5px;">Tu Tutor Inteligente de Idiomas</p>
    <span style="font-size: 12px; background: #e0e0e0; padding: 2px 8px; border-radius: 10px;">Nivel: Principiante 🐣</span>

    <div class="avatar-circle">
      🐧
    </div>

    <div class="form-group">
      <label>Profesor</label>
      <select id="select-tutor">
        <option value="Penny">Penny (Tutora)</option>
        <option value="Pingu">Pingu (Tutor)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Idioma Objetivo</label>
      <select id="select-language">
        <option value="Inglés GB">Inglés GB</option>
        <option value="Inglés US">Inglés US</option>
        <option value="Francés">Francés</option>
      </select>
    </div>

    <div class="form-group">
      <label>Tema de la Lección</label>
      <select id="select-topic">
        <option value="Curso General">Curso General</option>
        <option value="Viajes">Viajes y Turismo</option>
        <option value="Negocios">Negocios</option>
      </select>
    </div>

    <button class="btn-start" onclick="startLesson()">¡Comenzar Lección! 🚀</button>
  </div>

  <!-- VENTANA 2: CHAT -->
  <div id="view-chat">
    <div class="chat-header">
      <button class="btn-back" onclick="showSetup()">⚙️ Volver</button>
      <div class="chat-avatar" id="tutor-avatar">🐧</div>
      <h3 id="tutor-name">Penny 🐧</h3>
    </div>

    <div class="chat-body" id="chat-messages">
      <div class="message bot" id="welcome-msg">
        ¡Hola! Soy tu tutora inteligente. ¡Háblame y aprendamos juntos!
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" id="user-input" placeholder="Escribe o habla..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    function startLesson() {
      const tutor = document.getElementById('select-tutor').value;
      const lang = document.getElementById('select-language').value;
      
      document.getElementById('tutor-name').innerText = tutor + ' 🐧';
      document.getElementById('welcome-msg').innerText = `¡Hola! Soy ${tutor}, tu tutor(a) de ${lang}. ¡Háblame y aprendamos juntos!`;

      // Ocultar configuración y mostrar chat
      document.getElementById('view-setup').style.display = 'none';
      document.getElementById('view-chat').style.display = 'flex';
    }

    function showSetup() {
      // Ocultar chat y volver a la pantalla inicial
      document.getElementById('view-chat').style.display = 'none';
      document.getElementById('view-setup').style.display = 'block';
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      const chatBody = document.getElementById('chat-messages');

      // Agregar mensaje del usuario
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = text;
      chatBody.appendChild(userMsg);
      input.value = '';
      chatBody.scrollTop = chatBody.scrollHeight;

      try {
        // Petición al servidor de Node.js
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();

        // Agregar respuesta del bot
        const botMsg = document.createElement('div');
        botMsg.className = 'message bot';
        botMsg.innerText = data.reply;
        chatBody.appendChild(botMsg);
        chatBody.scrollTop = chatBody.scrollHeight;
      } catch (err) {
        console.error(err);
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
